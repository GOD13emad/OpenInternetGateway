name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - name: Smoke-test silent NSIS install on disposable runner
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content .\package.json -Raw | ConvertFrom-Json).version
          $setup = Join-Path (Get-Location) "dist\OpenInternetGateway-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "NSIS setup missing: $setup" }
          $installDir = Join-Path $env:RUNNER_TEMP "oig-nsis-$env:GITHUB_RUN_ID"
          if ($installDir -match '\s') { throw "NSIS /D path must have no spaces" }
          $install = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS silent install exit: $($install.ExitCode)" }
          $expected = @(
            'Open Internet Gateway.exe',
            'resources\app.asar',
            'resources\backend\windows',
            'resources\backend\common',
            'resources\pwsh\pwsh.exe',
            'Uninstall Open Internet Gateway.exe'
          )
          foreach ($relative in $expected) {
            $path = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $path)) { throw "NSIS installed payload missing: $relative" }
          }
          Write-Host "NSIS user-level silent install and installed payload PASS (disposable runner)"
          # Exercise the NSIS-INSTALLED executable, not win-unpacked or source.
          # Capture-only redirects backend state and suppresses tray/autostart;
          # it does not activate, disconnect or install any VPN.
          $captureRoot = Join-Path $env:RUNNER_TEMP "oig-installed-gui-$env:GITHUB_RUN_ID"
          $frame = Join-Path $captureRoot 'dashboard.png'
          New-Item -ItemType Directory -Path $captureRoot -Force | Out-Null
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = Join-Path $installDir 'Open Internet Gateway.exe'
          $startInfo.Arguments = '--background'
          $startInfo.UseShellExecute = $false
          $startInfo.Environment['OIG_CAPTURE_ONLY'] = '1'
          $startInfo.Environment['OIG_CAPTURE_ROOT'] = $captureRoot
          $startInfo.Environment['OIG_CAPTURE_PATH'] = $frame
          $startInfo.Environment['APPDATA'] = Join-Path $captureRoot 'Roaming'
          $startInfo.Environment['LOCALAPPDATA'] = Join-Path $captureRoot 'Local'
          $appProcess = [System.Diagnostics.Process]::Start($startInfo)
          if ($null -eq $appProcess) { throw 'Installed dashboard process did not start' }
          try {
            if (-not $appProcess.WaitForExit(35000)) { throw 'Installed dashboard capture timed out' }
            if ($appProcess.ExitCode -ne 0) { throw "Installed dashboard exited $($appProcess.ExitCode)" }
            if (-not (Test-Path -LiteralPath $frame -PathType Leaf)) { throw 'Installed dashboard image missing' }
            if ((Get-Item -LiteralPath $frame).Length -lt 4096) { throw 'Installed dashboard image suspiciously small' }
            Add-Type -AssemblyName System.Drawing
            $image = [System.Drawing.Image]::FromFile($frame)
            try {
              if ($image.Width -lt 900 -or $image.Height -lt 600) {
                throw "Installed dashboard dimensions invalid: $($image.Width)x$($image.Height)"
              }
              Write-Host "NSIS-installed Dashboard Electron render PASS: $($image.Width)x$($image.Height)"
            } finally { $image.Dispose() }
          } finally {
            if (-not $appProcess.HasExited) {
              $appProcess.Kill($true)
              [void]$appProcess.WaitForExit(5000)
            }
            $appProcess.Dispose()
          }
          # Exercise true installed-window Close, second-instance reopen and Quit
          # in a disposable hosted runner. The owner's desktop is never targeted.
          & (Join-Path (Get-Location) 'tools\qaWindowsInstalledTray.ps1') `
            -InstalledExe (Join-Path $installDir 'Open Internet Gateway.exe') `
            -ScratchRoot (Join-Path $env:RUNNER_TEMP "oig-hosted-tray-$env:GITHUB_RUN_ID")
          $uninstaller = Join-Path $installDir 'Uninstall Open Internet Gateway.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "NSIS silent uninstall exit: $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $installDir 'Open Internet Gateway.exe')) {
            throw 'NSIS silent uninstall left executable behind'
          }
          Write-Host 'NSIS silent uninstall PASS (disposable runner)'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: app/dist/*.exe

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
