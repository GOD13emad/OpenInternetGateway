name: Disposable Windows first-Connect fix validation

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-first-connect-acceptance.yml'
      - 'app/backend/windows/scripts/Ensure-OpenInternet.ps1'
      - 'app/backend/windows/scripts/Connect-OpenInternet.ps1'
      - 'app/backend/windows/scripts/Headless-Control.ps1'
      - 'app/backend/windows/scripts/Status-OpenInternet.ps1'
      - 'app/backend/windows/scripts/Route-Pair.ps1'
      - 'app/backend/windows/scripts/Profile-Policy.ps1'
      - 'app/src/main/platform-backend.js'
      - 'app/tests/app.test.js'
      - 'app/tests/openvpn-gui-exclusivity.test.js'
      - 'app/tests/headless-cancel-and-status-safety.test.js'
      - 'app/tests/first-connect-bootstrap-continuation.test.js'
      - 'app/tests/first-connect-start-diagnostic.test.js'
      - 'app/tests/hosted-first-connect.cjs'
      - 'app/tests/hosted-first-connect.ps1'
      - 'app/tests/windows-managed-connection-health.test.js'
      - 'app/tests/windows-route-pair.test.js'

permissions:
  contents: read

jobs:
  seed:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/v2.5.20-operator-safety-20261019' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Produce public OpenVPN seed using release method
        run: |
          python3 app/backend/linux/config_factory.py refresh --common app/common
          python3 app/backend/linux/config_factory.py status --common app/common
          test -f app/common/runtime/udp-cache/index.json
          test "$(find app/common/runtime/udp-cache -maxdepth 1 -name '*.ovpn' | wc -l)" -ge 6
      - uses: actions/upload-artifact@v7
        with:
          name: firstconnect-candidate-seed
          path: |
            app/common/runtime/udp-cache
            app/common/evidence/vpngate-mirror-api.csv
          if-no-files-found: error
          retention-days: 5

  first-connect:
    needs: seed
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/v2.5.20-operator-safety-20261019' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Confirm disposable Windows scope and fixed source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'HOSTED_RUNNER_REQUIRED'}
          if($env:GITHUB_REPOSITORY -ne 'GOD13emad/OpenInternetGateway'){throw 'REPO_MISMATCH'}
          $stable='568396a9cb9a0c17748075b4aac864bbebd27f04'
          $base='${{ github.event.pull_request.base.sha }}'
          if($env:GITHUB_BASE_REF -ne 'integration/qa-v2520-20261019'){throw 'UNEXPECTED_PR_BASE'}
          git merge-base --is-ancestor $stable HEAD
          if($LASTEXITCODE -ne 0){throw 'STABLE_MAIN_NOT_ANCESTOR'}
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'PR_BASE_NOT_ANCESTOR'}
          $required=@('.github/workflows/hosted-first-connect-acceptance.yml','app/backend/windows/scripts/Ensure-OpenInternet.ps1','app/backend/windows/scripts/Connect-OpenInternet.ps1','app/backend/windows/scripts/Headless-Control.ps1','app/backend/windows/scripts/Status-OpenInternet.ps1','app/src/main/platform-backend.js','app/tests/app.test.js','app/tests/openvpn-gui-exclusivity.test.js','app/tests/headless-cancel-and-status-safety.test.js','app/tests/first-connect-bootstrap-continuation.test.js','app/tests/first-connect-start-diagnostic.test.js','app/tests/hosted-first-connect.cjs','app/tests/hosted-first-connect.ps1','app/tests/windows-managed-connection-health.test.js','app/tests/windows-route-pair.test.js')
          $allowed=@($required+@('.github/workflows/build.yml','.github/workflows/release.yml','.gitignore','README.md','app/backend/linux/operator_profile.py','app/backend/linux/operator_rollback.py','app/backend/linux/operator_trial.py','app/package-lock.json','app/src/main/main.js','app/src/main/vpnbook-public-credentials.js','app/src/preload/preload.js','app/src/renderer/app.js','app/src/renderer/index.html','app/src/renderer/styles.css','app/tests/linux-deb-permissions.test.js','app/tests/linux-dns-trust-stable.test.js','app/tests/operator-profile-staging.test.js','app/tests/operator-rollback.test.js','app/tests/operator-trial.test.js','app/tests/vpnbook-free-credentials.test.js','app/tests/windows-route-guard-install-path.test.js','app/tools/afterAllArtifactBuild.js','app/tools/prepareElectronChecksumCache.js','app/tools/prepareWindowsPwsh.js','app/tools/validate.js','app/tests/prepare-electron-checksum-cache.test.js','app/tests/prepare-windows-pwsh.test.js','app/backend/windows/scripts/Route-Pair.ps1','app/backend/windows/scripts/Profile-Policy.ps1'))
          $actual=@(git diff --name-only $base HEAD)
          $missing=@($required|Where-Object {$_ -notin $actual})
          $unexpected=@($actual|Where-Object {$_ -notin $allowed})
          if($missing.Count){throw ('MISSING_REQUIRED_SCOPE: '+($missing -join ','))}
          if($unexpected.Count){throw ('UNEXPECTED_PRODUCT_SCOPE: '+($unexpected -join ','))}
          foreach($dependency in @('app/backend/windows/scripts/Route-Pair.ps1','app/backend/windows/scripts/Profile-Policy.ps1')){if(-not(Test-Path -LiteralPath $dependency)){throw ('REQUIRED_DEPENDENCY_MISSING: '+$dependency)}}
      - uses: actions/download-artifact@v8
        with:
          name: firstconnect-candidate-seed
          path: app/common
      - name: Seed bundled Windows backend, build exact candidate and run tests
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path backend/windows/runtime/udp-cache,backend/windows/evidence | Out-Null
          Copy-Item common/runtime/udp-cache/* backend/windows/runtime/udp-cache -Force
          if(Test-Path common/evidence/vpngate-mirror-api.csv){Copy-Item common/evidence/vpngate-mirror-api.csv backend/windows/evidence/vpngate-mirror-api.csv -Force}
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'NPM_CI_FAILED'}
          npm run lint
          if($LASTEXITCODE -ne 0){throw 'LINT_FAILED'}
          npm test
          if($LASTEXITCODE -ne 0){throw 'SOURCE_TEST_FAILED'}
          node tools/prepareElectronChecksumCache.js
          if($LASTEXITCODE -ne 0){throw 'ELECTRON_CHECKSUM_CACHE_SEED_FAILED'}
          npm run dist:win
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_PACKAGE_FAILED'}
          $exe='dist/OpenInternetGateway-Setup-2.5.20.exe'
          if(!(Test-Path -LiteralPath $exe)){throw 'CANDIDATE_NOT_BUILT'}
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('CANDIDATE_SHA256='+$sha)
      - name: First live Connect, diagnostics, and bounded rollback on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Get-Location) 'app/dist/OpenInternetGateway-Setup-2.5.20.exe'
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt=Join-Path $env:RUNNER_TEMP 'oig-first-connect-receipt.json'
          ./app/tests/hosted-first-connect.ps1 -Installer $exe -Receipt $receipt -ExpectedSha256 $sha
          if($LASTEXITCODE -ne 0){throw 'FIRST_CONNECT_NOT_ACCEPTED'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firstconnect-candidate-hosted-evidence
          path: |
            ${{ runner.temp }}/oig-first-connect-receipt.json
            ${{ runner.temp }}/oig-first-connect.stdout.log
            ${{ runner.temp }}/oig-first-connect.stderr.log
          retention-days: 7
          if-no-files-found: warn
